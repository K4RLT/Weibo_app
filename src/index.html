<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Desktop (新浪微博)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- App Left Sidebar Dock -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-top">
        <div class="brand-badge" title="Weibo Desktop App">
          <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM17.15 15.65C16.92 16.32 16.03 16.8 15.02 16.85C14.01 16.9 13.06 16.5 12.82 15.83C12.58 15.16 13.14 14.47 14.15 14.42C15.16 14.37 16.92 14.98 17.15 15.65ZM18.81 12.31C18.42 13.67 16.86 14.77 14.92 14.96C12.98 15.15 11.23 14.37 11.62 13.01C12.01 11.65 13.57 10.55 15.51 10.36C17.45 10.17 19.2 10.95 18.81 12.31ZM17.38 7.42C18.17 7.74 18.73 8.35 18.91 9.15C19.09 9.95 18.86 10.82 18.3 11.45C17.74 12.08 16.94 12.37 16.15 12.05C15.36 11.73 14.8 11.12 14.62 10.32C14.44 9.52 14.67 8.65 15.23 8.02C15.79 7.39 16.59 7.1 17.38 7.42Z" fill="url(#weibo-grad-side)"/>
            <defs>
              <linearGradient id="weibo-grad-side" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FF8200"/>
                <stop offset="1" stop-color="#E6162D"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <nav class="sidebar-nav">
          <button class="side-item active" id="sideBtnHome" title="Feed / Timeline (首页)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="side-label">Feed</span>
          </button>
          
          <button class="side-item" id="sideBtnHot" title="Hot Trends / Search (微博热搜)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span class="side-label">Trends</span>
          </button>

          <button class="side-item" id="sideBtnMsg" title="Messages / Notifications (消息中心)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span class="side-label">Messages</span>
          </button>

          <button class="side-item" id="sideBtnFav" title="Favorites / Bookmarks (我的收藏)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            <span class="side-label">Favs</span>
          </button>

          <button class="side-item" id="sideBtnProfile" title="Personal Profile (个人主页)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="side-label">Profile</span>
          </button>

          <div class="sidebar-divider"></div>

          <button class="side-item login-highlight" id="sideBtnLogin" title="Passport SSO Login (账号登录)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <span class="side-label">Login</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button class="side-item" id="sideBtnSettings" title="App Settings (设置)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span class="side-label">Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Body -->
    <div class="main-wrapper">
      <!-- App Header Toolbar -->
      <header class="app-header">
        <div class="header-left">
          <button id="btnToggleSidebar" class="nav-btn" title="Toggle Sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          
          <div class="nav-controls">
            <button id="btnBack" class="nav-btn" title="Back (Alt+Left)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <button id="btnForward" class="nav-btn" title="Forward (Alt+Right)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <button id="btnReload" class="nav-btn" title="Reload (Ctrl+R / F5)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
          </div>
        </div>

        <div class="header-center">
          <div class="mode-switch-group">
            <button id="btnLoginMode" class="mode-chip login-chip">
              🔑 SSO Login
            </button>
            <button id="btnDesktopMode" class="mode-chip active">
              🌐 Desktop Web
            </button>
            <button id="btnMobileMode" class="mode-chip">
              📱 Mobile Web
            </button>
          </div>
        </div>

        <div class="header-right">
          <button id="btnZoomOut" class="tool-btn" title="Zoom Out (Ctrl+Minus)">A-</button>
          <span id="zoomLevel" class="zoom-label">100%</span>
          <button id="btnZoomIn" class="tool-btn" title="Zoom In (Ctrl+Plus)">A+</button>
          
          <div class="divider"></div>

          <button id="btnCleanUI" class="tool-btn active-toggle" title="Toggle Clean Mode (Hide Banners & Sidebar Ads)">
            ✨ Clean Mode
          </button>

          <button id="btnThemeToggle" class="tool-btn icon-only" title="Toggle Dark/Light Theme">
            🌙
          </button>
        </div>
      </header>

      <!-- Webview Viewport Frame -->
      <main class="content-viewport" id="viewport">
        <iframe id="weiboFrame" src="https://weibo.com" allow="geolocation; microphone; camera; clipboard-read; clipboard-write" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
      </main>
    </div>
  </div>

  <!-- Settings Modal Drawer -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ App Preferences</h3>
        <button id="btnCloseSettings" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>🎨 Theme Selection</label>
          <select id="themeSelect" class="setting-input">
            <option value="dark">Dark Theme (Default)</option>
            <option value="light">Light Clean Theme</option>
            <option value="oled">AMOLED Pitch Black</option>
            <option value="orange">Weibo Signature Orange</option>
          </select>
        </div>

        <div class="setting-group">
          <label>🌐 Webview User Agent</label>
          <select id="uaSelect" class="setting-input">
            <option value="desktop">Default Desktop Chrome</option>
            <option value="mobile">Mobile Safari / iOS</option>
            <option value="ipad">iPad Webview</option>
          </select>
        </div>

        <div class="setting-group">
          <label>✨ Clean Mode Options</label>
          <div class="checkbox-row">
            <input type="checkbox" id="chkHideAds" checked>
            <label for="chkHideAds">Automatically hide promotional banner ads</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="chkHideSidebar" checked>
            <label for="chkHideSidebar">Hide trending recommendations sidebar in feed</label>
          </div>
        </div>

        <div class="setting-group">
          <label>⌨️ Global Keyboard Shortcuts</label>
          <div class="shortcut-info">
            <div><span>Reload:</span> <code>Ctrl + R / F5</code></div>
            <div><span>Go Home:</span> <code>Ctrl + H</code></div>
            <div><span>Login:</span> <code>Ctrl + L</code></div>
            <div><span>Zoom:</span> <code>Ctrl + / -</code></div>
            <div><span>Clean Mode:</span> <code>Ctrl + Shift + C</code></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

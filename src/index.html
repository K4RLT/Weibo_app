<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Desktop (新浪微博桌面版)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <!-- Desktop App Header Toolbar -->
  <header class="app-header" id="appHeader">
    <div class="header-left">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM17.15 15.65C16.92 16.32 16.03 16.8 15.02 16.85C14.01 16.9 13.06 16.5 12.82 15.83C12.58 15.16 13.14 14.47 14.15 14.42C15.16 14.37 16.92 14.98 17.15 15.65ZM18.81 12.31C18.42 13.67 16.86 14.77 14.92 14.96C12.98 15.15 11.23 14.37 11.62 13.01C12.01 11.65 13.57 10.55 15.51 10.36C17.45 10.17 19.2 10.95 18.81 12.31ZM17.38 7.42C18.17 7.74 18.73 8.35 18.91 9.15C19.09 9.95 18.86 10.82 18.3 11.45C17.74 12.08 16.94 12.37 16.15 12.05C15.36 11.73 14.8 11.12 14.62 10.32C14.44 9.52 14.67 8.65 15.23 8.02C15.79 7.39 16.59 7.1 17.38 7.42Z" fill="url(#weibo-grad)"/>
          <defs>
            <linearGradient id="weibo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FF8200"/>
              <stop offset="1" stop-color="#E6162D"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-title">Weibo Desktop</span>
      </div>

      <div class="nav-controls">
        <button id="btnBack" class="nav-btn" title="Back (后退)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="btnForward" class="nav-btn" title="Forward (前进)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button id="btnReload" class="nav-btn" title="Reload (刷新)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button id="btnHome" class="nav-btn" title="Home (首页)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
      </div>
    </div>

    <!-- URL / Mode Indicator & Quick Actions -->
    <div class="header-center">
      <div class="mode-switch-group">
        <button id="btnLoginMode" class="mode-chip login-chip" data-url="https://passport.weibo.com/sso/signin?entry=miniblog&source=miniblog&disp=popup&url=https%3A%2F%2Fweibo.com%2Fnewlogin%3Ftabtype%3Dweibo%26gid%3D102803%26openLoginLayer%3D0%26url%3Dhttps%3A%2F%2Fwww.weibo.com%2F&from=weibopro">
          🔑 Login (登录)
        </button>
        <button id="btnDesktopMode" class="mode-chip active" data-url="https://weibo.com">
          🌐 Home (首页)
        </button>
        <button id="btnMobileMode" class="mode-chip" data-url="https://m.weibo.cn">
          📱 Mobile View (移动端)
        </button>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="header-right">
      <button id="btnZoomOut" class="tool-btn" title="Zoom Out (缩小)">A-</button>
      <span id="zoomLevel" class="zoom-label">100%</span>
      <button id="btnZoomIn" class="tool-btn" title="Zoom In (放大)">A+</button>
      
      <div class="divider"></div>

      <button id="btnCleanUI" class="tool-btn active-toggle" title="Toggle Clean Mode (纯净模式)">
        ✨ Clean Mode
      </button>

      <button id="btnThemeToggle" class="tool-btn icon-only" title="Toggle Dark/Light Mode">
        🌙
      </button>
    </div>
  </header>

  <!-- Webview Container -->
  <main class="content-viewport" id="viewport">
    <iframe id="weiboFrame" src="https://weibo.com" allow="geolocation; microphone; camera; clipboard-read; clipboard-write" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
  </main>

  <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Desktop · 微博桌面版</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>
<body class="adw-dark">

  <!-- ═══ Navigation Toolbar (Adwaita Style) ═════════════════════ -->
  <header class="adw-toolbar" data-tauri-drag-region>
    <div class="toolbar-left">
      <button class="adw-btn" id="btnToggleSidebar" title="Toggle Sidebar" style="margin-right: 4px;">
        <span class="material-symbols-rounded">menu</span>
      </button>
      <div class="adw-pill-nav">
        <button class="adw-btn" id="btnBack" title="Back (Alt+←)">
          <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <button class="adw-btn" id="btnForward" title="Forward (Alt+→)">
          <span class="material-symbols-rounded">arrow_forward</span>
        </button>
        <button class="adw-btn" id="btnReload" title="Reload (Ctrl+R)">
          <span class="material-symbols-rounded">refresh</span>
        </button>
      </div>
    </div>

    <div class="toolbar-right">
      <button class="adw-btn win-ctrl" id="winMin" title="Minimize">
        <span class="material-symbols-rounded" style="font-size: 16px;">minimize</span>
      </button>
      <button class="adw-btn win-ctrl" id="winMax" title="Maximize">
        <span class="material-symbols-rounded" style="font-size: 16px;">crop_square</span>
      </button>
      <button class="adw-btn win-ctrl" id="winClose" title="Close">
        <span class="material-symbols-rounded" style="font-size: 16px;">close</span>
      </button>
    </div>
  </header>

  <!-- ═══ Main View ═════════════════════════════════════════════ -->
  <div class="app-body">

    <!-- Adwaita Slim Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <nav class="sidebar-nav">
        <button class="side-item active" id="sideBtnHome" title="Feed · 首页">
          <span class="material-symbols-rounded">home</span>
        </button>
        <button class="side-item" id="sideBtnHot" title="Hot Search · 微博热搜">
          <span class="material-symbols-rounded">local_fire_department</span>
        </button>
        <button class="side-item" id="sideBtnVideo" title="Video · 微博视频">
          <span class="material-symbols-rounded">play_circle</span>
        </button>
        <button class="side-item" id="sideBtnMsg" title="Messages · 消息">
          <span class="material-symbols-rounded">chat_bubble</span>
        </button>
        <button class="side-item" id="sideBtnFav" title="Favorites · 我的收藏">
          <span class="material-symbols-rounded">bookmark</span>
        </button>
        <button class="side-item" id="sideBtnProfile" title="Profile · 个人主页">
          <span class="material-symbols-rounded">person</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="side-item side-login" id="sideBtnLogin" title="Login · 登录">
          <span class="material-symbols-rounded">login</span>
        </button>
        <button class="side-item" id="sideBtnSettings" title="Preferences · 设置">
          <span class="material-symbols-rounded">settings</span>
        </button>
      </div>
    </aside>

    <!-- Webview Frame Placeholder -->
    <main class="content-viewport" id="contentViewport"></main>

  </div>

  <!-- ═══ Preferences Modal ═════════════════════════════════════ -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="material-symbols-rounded">settings</span>
        <h3>Preferences</h3>
        <button class="modal-close" id="btnCloseSettings">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <div class="modal-body">

        <!-- App Icon -->
        <div class="setting-group">
          <label class="setting-label">App Icon</label>
          <p class="setting-note">
            <span class="material-symbols-rounded" style="font-size:14px;vertical-align:-3px">info</span>
            Changes apply after restarting the app.
          </p>
          <div class="icon-picker">
            <button class="icon-opt" data-icon="weibo_block-normal" id="iconOpt0">
              <img src="icons/weibo_block-normal.png" alt="Original">
              <span>Original</span>
            </button>
            <button class="icon-opt" data-icon="weibo_block-dark" id="iconOpt1">
              <img src="icons/weibo_block-dark.png" alt="Block Dark">
              <span>Dark</span>
            </button>
            <button class="icon-opt" data-icon="weibo_block-white" id="iconOpt2">
              <img src="icons/weibo_block-white.png" alt="Block White">
              <span>White</span>
            </button>
            <button class="icon-opt" data-icon="weibo_circular-normal" id="iconOpt3">
              <img src="icons/weibo_circular-normal.png" alt="Circle">
              <span>Circle</span>
            </button>
            <button class="icon-opt" data-icon="weibo_circular-dark" id="iconOpt4">
              <img src="icons/weibo_circular-dark.png" alt="Circle Dark">
              <span>Circle Dark</span>
            </button>
            <button class="icon-opt" data-icon="weibo_circular-white" id="iconOpt5">
              <img src="icons/weibo_circular-white.png" alt="Circle White">
              <span>Circle White</span>
            </button>
          </div>
        </div>

        <!-- Theme -->
        <div class="setting-group">
          <label class="setting-label">Theme</label>
          <div class="chip-row">
            <button class="chip chip-active" data-theme="dark" id="themeChipDark">Dark</button>
            <button class="chip" data-theme="light" id="themeChipLight">Light</button>
          </div>
        </div>

        <!-- Shortcuts -->
        <div class="setting-group">
          <label class="setting-label">Keyboard Shortcuts</label>
          <div class="shortcut-info">
            <div><span>Reload</span><code>Ctrl+R</code></div>
            <div><span>Home</span><code>Ctrl+H</code></div>
            <div><span>Login</span><code>Ctrl+L</code></div>
            <div><span>Preferences</span><code>Ctrl+,</code></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

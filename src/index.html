<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo Desktop · 微博桌面版</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter for text, Material Symbols Rounded for all icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

  <!-- ═══ Custom Titlebar ═══════════════════════════════════════ -->
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="titlebar-left" data-tauri-drag-region>
      <img id="titlebarBrandIcon" class="titlebar-appicon" src="icons/weibo_circular-white.png" alt="">
      <span class="titlebar-title" data-tauri-drag-region>微博桌面版</span>
    </div>

    <!-- Back / Forward / Reload live in titlebar — no separate header bar -->
    <div class="titlebar-nav" data-tauri-drag-region="false">
      <button class="tbar-btn" id="btnBack" title="Back (Alt+←)">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <button class="tbar-btn" id="btnForward" title="Forward (Alt+→)">
        <span class="material-symbols-rounded">arrow_forward</span>
      </button>
      <button class="tbar-btn" id="btnReload" title="Reload (Ctrl+R)">
        <span class="material-symbols-rounded">refresh</span>
      </button>
    </div>

    <!-- Window Controls & Menu -->
    <div class="titlebar-winctrl">
      <button class="winbtn" id="btnTitlebarMenu" title="Menu / Settings">
        <span class="material-symbols-rounded">menu</span>
      </button>
      <button class="winbtn winbtn-min" id="btnMinimize" title="Minimize">
        <span class="material-symbols-rounded">remove</span>
      </button>
      <button class="winbtn winbtn-max" id="btnMaximize" title="Maximize">
        <span class="material-symbols-rounded">crop_square</span>
      </button>
      <button class="winbtn winbtn-close" id="btnClose" title="Close">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </header>

  <!-- ═══ Main Layout ═══════════════════════════════════════════ -->
  <div class="app-body">

    <!-- Sidebar dock — always visible, QQ-style thin strip -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-top">
        <!-- Brand logo — switches with theme -->
        <div class="brand-badge">
          <img id="sidebarBrandIcon" class="brand-img" src="icons/weibo_circular-white.png" alt="Weibo">
        </div>

        <nav class="sidebar-nav">
          <button class="side-item active" id="sideBtnHome" title="Feed · 首页">
            <span class="material-symbols-rounded">home</span>
            <span class="side-label">Feed</span>
          </button>
          <button class="side-item" id="sideBtnHot" title="Hot Search · 微博热搜">
            <span class="material-symbols-rounded">local_fire_department</span>
            <span class="side-label">Hot</span>
          </button>
          <button class="side-item" id="sideBtnVideo" title="Video · 微博视频">
            <span class="material-symbols-rounded">play_circle</span>
            <span class="side-label">Video</span>
          </button>
          <button class="side-item" id="sideBtnMsg" title="Messages · 消息">
            <span class="material-symbols-rounded">chat_bubble</span>
            <span class="side-label">Messages</span>
          </button>
          <button class="side-item" id="sideBtnFav" title="Favorites · 我的收藏">
            <span class="material-symbols-rounded">bookmark</span>
            <span class="side-label">Favs</span>
          </button>
          <button class="side-item" id="sideBtnProfile" title="Profile · 个人主页">
            <span class="material-symbols-rounded">person</span>
            <span class="side-label">Profile</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button class="side-item side-login" id="sideBtnLogin" title="Login · 登录">
          <span class="material-symbols-rounded">login</span>
          <span class="side-label">Login</span>
        </button>
        <button class="side-item" id="sideBtnSettings" title="Settings · 设置">
          <span class="material-symbols-rounded">settings</span>
          <span class="side-label">Settings</span>
        </button>
      </div>
    </aside>

    <!-- Webview iframe -->
    <main class="content-viewport">
      <iframe id="weiboFrame"
        src="https://weibo.com"
        allow="geolocation; microphone; camera; clipboard-read; clipboard-write"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals">
      </iframe>
    </main>

  </div><!-- /app-body -->

  <!-- ═══ Settings Drawer ═══════════════════════════════════════ -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="material-symbols-rounded modal-hdr-icon">settings</span>
        <h3>App Preferences</h3>
        <button class="modal-close" id="btnCloseSettings">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <div class="modal-body">

        <!-- View Mode (was in top bar) -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">language</span>
            View Mode
          </label>
          <div class="chip-row">
            <button class="chip chip-login" id="btnLoginMode">
              <span class="material-symbols-rounded">lock</span> SSO Login
            </button>
            <button class="chip chip-active" id="btnDesktopMode">
              <span class="material-symbols-rounded">computer</span> Desktop
            </button>
            <button class="chip" id="btnMobileMode">
              <span class="material-symbols-rounded">smartphone</span> Mobile
            </button>
          </div>
        </div>

        <!-- Zoom (was in top bar) -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">zoom_in</span>
            Zoom Level
          </label>
          <div class="zoom-row">
            <button class="zoom-btn" id="btnZoomOut">
              <span class="material-symbols-rounded">remove</span>
            </button>
            <span id="zoomLevel" class="zoom-label">100%</span>
            <button class="zoom-btn" id="btnZoomIn">
              <span class="material-symbols-rounded">add</span>
            </button>
          </div>
        </div>

        <!-- Clean Mode (was in top bar) -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">auto_fix_high</span>
            Clean Mode
          </label>
          <div class="toggle-row">
            <span class="toggle-desc">Hide ads &amp; sidebar recommendations</span>
            <button class="toggle-btn active" id="btnCleanUI">
              <span class="material-symbols-rounded">check</span>
              On
            </button>
          </div>
        </div>

        <!-- Theme -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">palette</span>
            Theme
          </label>
          <div class="chip-row">
            <button class="chip chip-active" data-theme="dark" id="themeChipDark">
              <span class="material-symbols-rounded">dark_mode</span> Dark
            </button>
            <button class="chip" data-theme="light" id="themeChipLight">
              <span class="material-symbols-rounded">light_mode</span> Light
            </button>
            <button class="chip" data-theme="oled" id="themeChipOled">
              <span class="material-symbols-rounded">brightness_empty</span> AMOLED
            </button>
            <button class="chip" data-theme="orange" id="themeChipOrange">
              <span class="material-symbols-rounded">wb_sunny</span> Weibo Orange
            </button>
          </div>
        </div>

        <!-- App Icon -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">apps</span>
            App Icon Style
          </label>
          <p class="setting-desc">Applies on next launch.</p>
          <div class="icon-picker-grid" id="iconPickerGrid">
            <button class="icon-option" data-icon="weibo_block-normal" id="iconOpt-block-normal">
              <img src="icons/weibo_block-normal.png" alt="Block Original">
              <span>Original</span>
            </button>
            <button class="icon-option" data-icon="weibo_block-dark" id="iconOpt-block-dark">
              <img src="icons/weibo_block-dark.png" alt="Block Dark">
              <span>Dark</span>
            </button>
            <button class="icon-option" data-icon="weibo_block-white" id="iconOpt-block-white">
              <img src="icons/weibo_block-white.png" alt="Block White">
              <span>White</span>
            </button>
            <button class="icon-option" data-icon="weibo_circular-normal" id="iconOpt-circular-normal">
              <img src="icons/weibo_circular-normal.png" alt="Circle Original">
              <span>Circle</span>
            </button>
            <button class="icon-option" data-icon="weibo_circular-dark" id="iconOpt-circular-dark">
              <img src="icons/weibo_circular-dark.png" alt="Circle Dark">
              <span>Circle Dark</span>
            </button>
            <button class="icon-option" data-icon="weibo_circular-white" id="iconOpt-circular-white">
              <img src="icons/weibo_circular-white.png" alt="Circle White">
              <span>Circle White</span>
            </button>
          </div>
          <p class="icon-selected-label" id="iconSelectedLabel">Selected: <strong>Original</strong></p>
        </div>

        <!-- Keyboard Shortcuts -->
        <div class="setting-group">
          <label class="setting-label">
            <span class="material-symbols-rounded">keyboard</span>
            Keyboard Shortcuts
          </label>
          <div class="shortcut-info">
            <div><span>Reload</span><code>Ctrl+R · F5</code></div>
            <div><span>Home</span><code>Ctrl+H</code></div>
            <div><span>Login</span><code>Ctrl+L</code></div>
            <div><span>Zoom</span><code>Ctrl + / −</code></div>
            <div><span>Settings</span><code>Ctrl+,</code></div>
          </div>
        </div>

      </div><!-- /modal-body -->
    </div><!-- /modal-card -->
  </div><!-- /settingsModal -->

  <script src="main.js"></script>
</body>
</html>

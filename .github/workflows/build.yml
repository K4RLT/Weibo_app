name: Build & Release Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webkit & GTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm install

      - name: Generate Tauri icons from official Weibo PNG
        run: npx @tauri-apps/cli icon src-tauri/icons/weibo_block-normal.png

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Weibo Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## 微博桌面版 Weibo Desktop ${{ github.ref_name }}

            Unofficial lightweight desktop wrapper for Weibo — built with Tauri.

            ### Download
            | Platform | File |
            |---|---|
            | 🪟 Windows | `.exe` installer or `.msi` |
            | 🐧 Linux | `.AppImage` (portable) or `.deb` |
            | 🍎 macOS | `.dmg` |

            > ⚠️ This is an unofficial app, not affiliated with Sina Weibo.
          releaseDraft: false
          prerelease: false
